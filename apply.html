<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nightwave | Rust Application</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/Profile_Picture_2.png">
</head>
<body>
    <main class="container">
        <header class="header">
            <a href="index.html" class="logo-link">
                <img src="images/Nightwave with Bean Logo.png" alt="Nightwave logo" class="logo" width="300">
            </a>
        </header>

        <section class="contact-section">
            <a href="index.html" class="back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px;">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back to Links
            </a>
            <h2 class="section-title">Rust Application</h2>
            <form id="contact-form" class="contact-form">
                <div class="form-group">
                    <input type="text" name="name" placeholder="Name" required aria-label="Your Name">
                </div>
                <div class="form-group">
                    <input type="email" name="email" placeholder="Email Address" required aria-label="Your Email Address">
                </div>
                <div class="form-group">
                    <textarea name="message" placeholder="Why do you want to join?" rows="6" required aria-label="Your Message"></textarea>
                </div>
                <button type="submit" class="btn submit-btn">Submit Application</button>
            </form>
        </section>

        <footer class="footer">
            <p>Site Powered By <a href="https://relaycomputerconsulting.com" target="_blank" rel="noopener noreferrer">Relay Computer Consulting</a></p>
        </footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
